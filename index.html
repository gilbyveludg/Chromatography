<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Actividad guiada: decisiones cromatográficas con evidencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F3; --panel:#FFFFFF; --ink:#16232A; --muted:#56666E; --line:#CAD4D0;
  --glass:#2B5E88; --glass-soft:#DDE8F1; --a:#2F7D4E; --b:#D2701A; --ghost:#8A969C;
  --good:#2F7D4E; --bad:#B23A3A; --shade:rgba(43,94,136,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F171B; --panel:#162127; --ink:#E3ECE8; --muted:#9AABB2; --line:#2B3A41;
    --glass:#7FB0DA; --glass-soft:#1C3143; --a:#62C08A; --b:#F0A04B; --ghost:#6F7D84;
    --good:#62C08A; --bad:#E77676; --shade:rgba(127,176,218,.10);
  }
}
:root[data-theme="dark"]{
  --paper:#0F171B; --panel:#162127; --ink:#E3ECE8; --muted:#9AABB2; --line:#2B3A41;
  --glass:#7FB0DA; --glass-soft:#1C3143; --a:#62C08A; --b:#F0A04B; --ghost:#6F7D84;
  --good:#62C08A; --bad:#E77676; --shade:rgba(127,176,218,.10);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15.5px;line-height:1.55;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-weight:600;line-height:1.2;margin:0}
h1{font-size:1.8rem} h2{font-size:1.35rem} h3{font-size:1.1rem} h4{font-size:1rem}
sub,sup{font-size:.72em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--glass);outline-offset:2px}

.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 20px 10px;margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.bar-in{max-width:980px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar-title{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:1.05rem}
.progress{flex:1;min-width:180px;max-width:420px}
.progress .track{height:8px;border-radius:4px;background:var(--glass-soft);overflow:hidden}
.progress .track span{display:block;height:100%;background:var(--glass);transition:width .3s}
.progress small{color:var(--muted);font-size:.8rem}
main{max-width:980px;margin:0 auto;padding:20px 20px 60px}

.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 16px}
.step.current{border:2px solid var(--glass)}
.step-body{padding:18px 20px}
.kicker{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px;color:var(--muted);font-size:.88rem}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.8rem;font-weight:700}
.tag.pred{background:var(--glass-soft);color:var(--glass)}
.tag.sim{background:var(--glass);color:var(--panel)}
.tag.diag{border:1.5px dashed var(--glass);color:var(--glass)}
.case{background:var(--shade);border-left:4px solid var(--glass);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.case p{margin:0 0 6px} .case p:last-child{margin:0}
.lock-note{font-size:.88rem;color:var(--muted);margin:10px 0 0}
details.step > summary{list-style:none;cursor:pointer;padding:12px 20px;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.step > summary::-webkit-details-marker{display:none}
details.step > summary .when{color:var(--muted);font-size:.85rem;white-space:nowrap}
details.step[open] > summary{border-bottom:1px solid var(--line)}
.done-body{padding:12px 20px 16px;font-size:.93rem}
.qa{margin:0 0 10px}
.qa b{display:block;font-weight:700}
.ans{white-space:pre-wrap}

.field{margin:16px 0}
.field > label, .field > .lbl{display:block;font-weight:700;margin-bottom:6px}
.field textarea{width:100%;min-height:84px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);resize:vertical}
.field input[type=text], .field input[type=number]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.field input[type=text]{width:100%}
.field input[type=number]{width:150px;text-align:right}
.field .unit{margin-left:8px;color:var(--muted)}
.field select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);max-width:100%}
.field.missing textarea,.field.missing input,.field.missing select{border-color:var(--bad);border-width:2px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 18px}
.nums .field{margin:0}
.nums label{font-weight:400!important}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
th:first-child,td:first-child{text-align:left}
thead th{color:var(--muted);font-size:.84rem;font-weight:700}
.tbl-scroll{overflow-x:auto}
.ok{color:var(--good);font-weight:700}
.no{color:var(--bad);font-weight:700}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px}
.btn.primary{background:var(--glass);border-color:var(--glass);color:var(--panel);font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.err{color:var(--bad);font-size:.9rem}
.formula{font-family:"Newsreader",Georgia,serif;font-size:1.05rem;background:var(--shade);padding:8px 12px;border-radius:8px;overflow-x:auto;white-space:nowrap;margin:10px 0}

/* simulador */
.simwrap{margin:16px 0}
.sim{display:grid;grid-template-columns:1fr;gap:16px}
.sim.with-ctl{grid-template-columns:250px minmax(0,1fr)}
.sim-ctl{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;align-self:start}
.sim-ctl h4{color:var(--glass);margin-bottom:6px}
.ctl{margin:8px 0 12px}
.ctl label{display:block;font-size:.88rem;margin-bottom:2px}
.ctl-row{display:flex;gap:6px;align-items:center}
.ctl-row input[type=range]{flex:1;min-width:0;accent-color:var(--glass)}
.ctl-row input[type=number]{width:70px;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:right}
.ctl .u{font-size:.8rem;color:var(--muted);min-width:38px}
.sim-main{min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.toolbar .btn{padding:6px 11px;font-size:.9rem}
figure{margin:0 0 12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;position:relative}
figcaption{font-size:.84rem;color:var(--muted);margin-bottom:4px}
canvas{display:block;width:100%}
.cv-col{height:104px}
.cv-chrom{height:290px;cursor:crosshair}
.cv-std{height:250px}
.timebar{display:flex;gap:10px;align-items:center;margin-top:6px}
.timebar input{flex:1;accent-color:var(--glass)}
.timebar output{min-width:90px;text-align:right;font-size:.85rem;color:var(--muted)}
.readout{position:absolute;right:14px;top:8px;font-size:.85rem;color:var(--ink);font-weight:700}
.results,.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.results .panel,.two .panel{margin-bottom:0}
.panel h4{margin-bottom:4px}
.panel td,.panel th{text-align:right}
.panel td:first-child,.panel th:first-child{text-align:left}
.delta{display:block;font-size:.74rem;color:var(--muted)}
.delta.up{color:var(--glass)} .delta.down{color:var(--b)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.flag{margin:6px 0 0;padding:6px 9px;border-radius:8px;font-size:.86rem;background:var(--shade)}
.flag.bad{color:var(--bad)} .flag.good{color:var(--good)}
.meter{margin:6px 0}
.meter .lr{display:flex;justify-content:space-between;font-size:.86rem}
.meter .mb{height:9px;background:var(--glass-soft);border-radius:5px;overflow:hidden}
.meter .mb span{display:block;height:100%;background:var(--glass)}
.legend{font-size:.88rem;color:var(--muted);margin:0 0 8px}

.report{font-size:.93rem}
.report h3{margin:18px 0 6px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:12px 0}
.summary-grid div{background:var(--shade);border-radius:8px;padding:8px 12px}
.summary-grid b{display:block;font-family:"Newsreader",Georgia,serif;font-size:1.4rem}
.howto{margin:10px 0 0;padding-left:20px}
.howto li{margin:3px 0}

@media (max-width:760px){
  .sim.with-ctl{grid-template-columns:1fr}
  .results,.two{grid-template-columns:1fr}
  .cv-chrom{height:230px}
  h1{font-size:1.5rem}
}
@media print{
  .bar,.no-print,.step:not(.final){display:none!important}
  body{background:#fff;color:#000}
  .step.final{border:0}
}
</style>
</head>
<body>
<div class="bar">
  <div class="bar-in">
    <span class="bar-title">Decisiones cromatográficas con evidencia</span>
    <div class="progress" aria-live="polite"><div class="track"><span id="progFill" style="width:0"></span></div><small id="progTxt"></small></div>
  </div>
</div>
<main id="steps"></main>

<script>
(function(){
"use strict";
const R=8.314;
const STORE='cromato-actividad-guiada-v1';
const $=id=>document.getElementById(id);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(v,sig=3){
  if(v===null||v===undefined||!isFinite(v)) return '—';
  const a=Math.abs(v);
  if(a>=1000) return Math.round(v).toLocaleString('es-MX');
  if(a>=100) return v.toLocaleString('es-MX',{maximumFractionDigits:1});
  if(a===0) return '0';
  const d=Math.max(0,sig-1-Math.floor(Math.log10(a)));
  return v.toLocaleString('es-MX',{minimumFractionDigits:Math.min(d,4),maximumFractionDigits:Math.min(d,4)});
}
const hhmm=t=>new Date(t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});

/* ================= MODELO ================= */
const PRESETS={
  capsa:{names:['Capsaicina','Dihidrocapsaicina'],s:{type:'packed',L:15,dc:4.6,eps:0.65,phi:0.12,df:0.25,F:1.0,H:15,T:30,A:{dH:-15,dS:-22.72},B:{dH:-17,dS:-28.75}}},
  terp:{names:['Limoneno','1,8-Cineol'],s:{type:'open',L:3000,dc:0.25,eps:0.65,phi:0.12,df:0.25,F:1.2,H:300,T:80,A:{dH:-45,dS:-63.16},B:{dH:-48,dS:-70.96}}}
};
function simState(preset,mods){const p=PRESETS[preset];const s=clone(p.s);s.names=p.names.slice();Object.assign(s,mods||{});return s;}
function compute(s){
  const open=s.type==='open';
  const A=Math.PI*Math.pow(s.dc/20,2);
  const eps=open?1:s.eps;
  const Vm=eps*A*s.L, u=s.F/(eps*A), tM=s.L/u;
  const phi=open?4*s.df/(s.dc*1000):s.phi;
  const TK=s.T+273.15, N=s.L*1e4/s.H;
  const an=['A','B'].map((id,i)=>{const p=s[id];const dG=p.dH*1000-TK*p.dS;const KD=Math.exp(-dG/(R*TK));const k=KD*phi;const tR=tM*(1+k);const sigma=tR/Math.sqrt(N);
    return {id,i,name:s.names[i],dG,KD,k,tR,tRp:tM*k,sigma,Wb:4*sigma,Wh:2.3548*sigma};});
  const inverted=an[0].k>an[1].k;const p1=inverted?an[1]:an[0],p2=inverted?an[0]:an[1];
  const alpha=p2.k/p1.k;
  const Rs=(p2.tR-p1.tR)/(0.5*(p1.Wb+p2.Wb));
  const RsP=Math.sqrt(N)/4*(alpha-1)/alpha*p2.k/(1+p2.k);
  const tEnd=p2.tR+3*p2.sigma;
  return {s,open,A,eps,Vm,u,tM,phi,TK,N,H:s.H,L:s.L,F:s.F,an,p1,p2,alpha,Rs,RsP,inverted,tEnd,solvent:s.F*tEnd};
}
const MYST=[
  {id:'Fup',label:'Aumentó el flujo volumétrico F',f:s=>{s.F*=1.5;}},
  {id:'Fdn',label:'Disminuyó el flujo volumétrico F',f:s=>{s.F*=0.6;}},
  {id:'L',label:'Se usó una columna más larga con el mismo relleno',f:s=>{s.L*=2;}},
  {id:'H',label:'Mejoró la eficiencia (H menor)',f:s=>{s.H*=0.4;}},
  {id:'phi',label:'Aumentó la relación de fases (más fase estacionaria)',f:s=>{if(s.type==='open')s.df*=1.8;else s.phi*=1.8;}},
  {id:'T',label:'Aumentó la temperatura de la columna',f:s=>{s.T+=15;}},
  {id:'eps',label:'Aumentó la porosidad del lecho',f:s=>{s.eps=Math.min(0.9,s.eps+0.15);},packedOnly:true},
  {id:'dc',label:'Disminuyó el diámetro interno de la columna',f:s=>{s.dc*=0.7;}}
];
const mystById=id=>MYST.find(m=>m.id===id);

/* valores de referencia para calificar */
const RC=compute(simState('capsa'));
const RMICRO=compute(simState('capsa',{dc:2.1}));
const RMONO=compute(simState('capsa',{eps:0.8}));
const RT80=compute(simState('terp'));
const RT100=compute(simState('terp',{T:100}));
const Tmax=(()=>{let lo=80,hi=111;for(let i=0;i<40;i++){const m=(lo+hi)/2;const r=compute(simState('terp',{T:m}));if(r.Rs>=1.5)lo=m;else hi=m;}return lo;})();
const tAtTmax=compute(simState('terp',{T:Tmax})).p2.tR;
const Tcoel=(()=>{const s=PRESETS.terp.s;return (s.B.dH-s.A.dH)*1000/(s.B.dS-s.A.dS)-273.15;})();
const Lreq=(()=>{const r=RC;const Nreq=16*2.25*Math.pow(r.alpha/(r.alpha-1),2)*Math.pow((1+r.p2.k)/r.p2.k,2);return Nreq*r.H/1e4;})();
function arrowOf(a,b){const rel=(b-a)/Math.abs(a);if(Math.abs(rel)<0.005)return 'eq';return b>a?'up':'down';}
const ARW={up:'↑',down:'↓',eq:'='};
const ARWOPTS=[['','—'],['up','↑ aumenta'],['down','↓ disminuye'],['eq','= no cambia']];

const MATRIX_ROWS=[['F','F'],['L','L'],['H','H'],['phi','V<sub>s</sub>/V<sub>m</sub>'],['T','T'],['eps','ε'],['dc','d<sub>c</sub> (F constante)']];
const MATRIX_COLS=[['tM','t<sub>M</sub>'],['tR','t<sub>R</sub>'],['k','k'],['a','α'],['N','N'],['Wb','W<sub>b</sub>'],['Rs','R<sub>s</sub>']];
const MATRIX_KEY={
  F:['down','down','eq','eq','eq','down','eq'], L:['up','up','eq','eq','up','up','up'], H:['eq','eq','eq','eq','down','up','down'],
  phi:['eq','up','up','eq','eq','up','up'], T:['eq','down','down','down','eq','down','down'], eps:['up','up','eq','eq','eq','up','eq'], dc:['up','up','eq','eq','eq','up','eq']};

/* ================= PASOS ================= */
const CAPSA_CASE=`<div class="case"><p><b>Caso.</b> Un laboratorio de control de calidad cuantifica capsaicina y dihidrocapsaicina en extractos de chile por HPLC en fase reversa (C18, 150 × 4.6 mm, ε = 0.65, F = 1.0 mL/min, 30 °C). La columna ya tiene uso y el analista sospecha que la separación no cumple.</p></div>`;
const TERP_CASE=`<div class="case"><p><b>Caso.</b> Un laboratorio que certifica aceites esenciales de limón analiza limoneno y 1,8-cineol por GC capilar (30 m × 0.25 mm, d<sub>f</sub> = 0.25 µm, F = 1.2 mL/min). Son un par crítico en columnas poco polares. A 80 °C la corrida tarda más de 13 min y la gerencia pide acortarla subiendo la temperatura del horno.</p>
<div class="tbl-scroll"><table><thead><tr><th>Analito</th><th>ΔH° (kJ/mol)</th><th>ΔS° (J/mol·K)</th></tr></thead><tbody><tr><td>Limoneno</td><td>−45.0</td><td>−63.16</td></tr><tr><td>1,8-Cineol</td><td>−48.0</td><td>−70.96</td></tr></tbody></table></div></div>`;

const STEPS=[
 {id:'inicio',kind:'start',block:'Inicio',title:'Datos del equipo',
  intro:`<p>Esta actividad dura 90 minutos y avanza paso a paso. En cada bloque primero escriben su <b>predicción</b>; al enviarla queda <b>bloqueada</b> y solo entonces se abre la parte del simulador que corresponde. No podrán regresar a modificar respuestas enviadas: cada envío queda registrado con su hora.</p>
  <p>Al terminar se genera un reporte que deben guardar como PDF y subir a Classroom.</p>`,
  fields:[{id:'equipo',type:'line',label:'Nombre o número de equipo'},{id:'integrantes',type:'text',label:'Integrantes (nombre completo y código)',rows:3},{id:'grupo',type:'line',label:'Grupo o sección'}],
  submit:'Comenzar la actividad'},

 {id:'b1a',kind:'sim',block:'Bloque 1. Leer un cromatograma',title:'Medir en el cromatograma',
  intro:CAPSA_CASE+`<p>El simulador muestra el cromatograma, pero <b>sin resultados numéricos</b>. Pasen el cursor sobre la gráfica para leer tiempos (arriba a la derecha aparece t). Las líneas horizontales marcan W<sub>h</sub> y las tangentes W<sub>b</sub>. La columna mide L = 15 cm.</p>
  <div class="formula">k = (t<sub>R</sub> − t<sub>M</sub>)/t<sub>M</sub> &nbsp;·&nbsp; α = k<sub>2</sub>/k<sub>1</sub> &nbsp;·&nbsp; N = 5.54 (t<sub>R</sub>/W<sub>h</sub>)² &nbsp;·&nbsp; H = L/N &nbsp;·&nbsp; R<sub>s</sub> = 1.18 (t<sub>R2</sub> − t<sub>R1</sub>)/(W<sub>h1</sub> + W<sub>h2</sub>)</div>`,
  sim:{preset:'capsa',panels:['col','chrom'],showW:true},
  fields:[{type:'nums',items:[
    {id:'tM',label:'t<sub>M</sub>',unit:'min',actual:()=>RC.tM,tol:.05},
    {id:'tR1',label:'t<sub>R</sub> capsaicina',unit:'min',actual:()=>RC.an[0].tR,tol:.03},
    {id:'tR2',label:'t<sub>R</sub> dihidrocapsaicina',unit:'min',actual:()=>RC.an[1].tR,tol:.03},
    {id:'Wh1',label:'W<sub>h</sub> capsaicina',unit:'min',actual:()=>RC.an[0].Wh,tol:.1},
    {id:'Wh2',label:'W<sub>h</sub> dihidrocapsaicina',unit:'min',actual:()=>RC.an[1].Wh,tol:.1},
    {id:'k1',label:'k capsaicina',unit:'',actual:()=>RC.an[0].k,tol:.05},
    {id:'k2',label:'k dihidrocapsaicina',unit:'',actual:()=>RC.an[1].k,tol:.05},
    {id:'alpha',label:'α',unit:'',actual:()=>RC.alpha,tol:.02},
    {id:'N',label:'N (del segundo pico)',unit:'',actual:()=>RC.N,tol:.2},
    {id:'H',label:'H',unit:'µm',actual:()=>RC.H,tol:.2},
    {id:'Rs',label:'R<sub>s</sub>',unit:'',actual:()=>RC.Rs,tol:.12}]}],
  submit:'Enviar mediciones y ver los valores reales'},

 {id:'b1b',kind:'sim',block:'Bloque 1. Leer un cromatograma',title:'Comparar con el simulador',
  intro:`<p>Ahora ven los valores calculados por el simulador. Comparen con sus mediciones (la tabla de sus valores y la diferencia aparece en el paso anterior).</p>`,
  sim:{preset:'capsa',panels:['chrom','tables'],showW:true},
  fields:[
   {id:'q1',type:'text',label:'1. ¿Por qué su N calculada con W<sub>h</sub> difiere de la del simulador? ¿Qué error pesa más en N: el de t<sub>R</sub> o el de W<sub>h</sub>? Justifiquen con la ecuación.'},
   {id:'q2',type:'text',label:'2. R<sub>s</sub> con anchuras y R<sub>s</sub> de Purnell no coinciden exactamente. ¿Qué suposición hace Purnell sobre las anchuras de los dos picos?'},
   {id:'q3',type:'text',label:'3. ¿Los valores de k están en el intervalo útil? Si k<sub>1</sub> fuera 0.5, ¿qué problema tendría la cuantificación de capsaicina en una matriz compleja?'},
   {id:'q4',type:'text',label:'4. Conclusión del analista: ¿el método cumple el criterio de separación a línea base? ¿Qué número lo demuestra?'}],

const DIAG_FIELDS=[
  {id:'evid',type:'text',label:'Evidencia observada: ¿cambió t<sub>M</sub>? ¿todos los picos se desplazaron en la misma proporción? ¿cambió la separación relativa? ¿cambiaron las anchuras?'},
  {id:'hyp',type:'select',label:'Hipótesis: ¿qué parámetro cambió?',options:MYST.map(m=>[m.id,m.label])}];
function fieldsOf(st){return st.kind==='diag'?DIAG_FIELDS:(st.fields||[]);}

/* ================= ESTADO ================= */
let state={cur:0,ans:{},draft:{},time:{},myst:{},start:null};
try{const raw=localStorage.getItem(STORE);if(raw){const o=JSON.parse(raw);if(o&&typeof o.cur==='number')state=Object.assign(state,o);}}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}

/* ================= FORMULARIOS ================= */
function arrowSelect(name,val){return `<select data-f="${name}" aria-label="predicción">${ARWOPTS.map(([v,l])=>`<option value="${v}" ${v===val?'selected':''}>${l}</option>`).join('')}</select>`;}
function fieldHTML(st,f,d){
  if(f.type==='nums') return `<div class="nums">${f.items.map(it=>`<div class="field" data-req="${it.id}"><label for="f_${st.id}_${it.id}">${it.label}</label><input type="number" step="any" id="f_${st.id}_${it.id}" data-f="${it.id}" value="${esc(d[it.id]??'')}">${it.unit?`<span class="unit">${it.unit}</span>`:''}</div>`).join('')}</div>`;
  if(f.type==='line') return `<div class="field" data-req="${f.id}"><label for="f_${st.id}_${f.id}">${f.label}</label><input type="text" id="f_${st.id}_${f.id}" data-f="${f.id}" value="${esc(d[f.id]??'')}"></div>`;
  if(f.type==='text') return `<div class="field" data-req="${f.id}"><label for="f_${st.id}_${f.id}">${f.label}</label><textarea id="f_${st.id}_${f.id}" data-f="${f.id}" rows="${f.rows||3}">${esc(d[f.id]??'')}</textarea></div>`;
  if(f.type==='select') return `<div class="field" data-req="${f.id}"><label for="f_${st.id}_${f.id}">${f.label}</label><select id="f_${st.id}_${f.id}" data-f="${f.id}"><option value="">Elige una hipótesis…</option>${f.options.map(([v,l])=>`<option value="${v}" ${d[f.id]===v?'selected':''}>${l}</option>`).join('')}</select></div>`;
  if(f.type==='arrows') return `<div class="field"><span class="lbl">${f.label}</span><div class="tbl-scroll"><table><thead><tr><th>Parámetro</th><th>Predicción</th></tr></thead><tbody>${f.params.map(([k,l])=>`<tr data-req="${f.id}.${k}"><td>${l}</td><td>${arrowSelect(f.id+'.'+k,d[f.id+'.'+k])}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(f.type==='matrix') return `<div class="field"><div class="tbl-scroll"><table><thead><tr><th>Si aumenta…</th>${MATRIX_COLS.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${MATRIX_ROWS.map(([r,rl])=>`<tr><td>${rl}</td>${MATRIX_COLS.map(([c])=>`<td data-req="mat.${r}.${c}"><select data-f="mat.${r}.${c}" aria-label="${r} ${c}">${[['','—'],['up','↑'],['down','↓'],['eq','=']].map(([v,l])=>`<option value="${v}" ${d['mat.'+r+'.'+c]===v?'selected':''}>${l}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  return '';
}
function reqKeys(st){const ks=[];fieldsOf(st).forEach(f=>{
  if(f.type==='nums')f.items.forEach(it=>ks.push(it.id));
  else if(f.type==='arrows')f.params.forEach(([k])=>ks.push(f.id+'.'+k));
  else if(f.type==='matrix')MATRIX_ROWS.forEach(([r])=>MATRIX_COLS.forEach(([c])=>ks.push('mat.'+r+'.'+c)));
  else ks.push(f.id);});return ks;}

/* vista de respuestas enviadas (también se usa en el reporte) */
function markNum(v,act,tol){const x=parseFloat(v);if(!isFinite(x))return '';const dif=(x-act)/Math.abs(act);return {dif,ok:Math.abs(dif)<=tol};}
function doneHTML(st){
  const a=state.ans[st.id]||{};let h='';
  if(st.kind==='diag'){
    const real=mystById(state.myst[st.id]);const ok=a.hyp===state.myst[st.id];
    h+=`<div class="qa"><b>Evidencia</b><span class="ans">${esc(a.evid)}</span></div>`;
    h+=`<div class="qa"><b>Hipótesis</b>${esc(mystById(a.hyp)?.label||'—')} <span class="${ok?'ok':'no'}">${ok?'✓ correcta':'✗ incorrecta'}</span></div>`;
    h+=`<div class="qa"><b>Cambio real</b>${esc(real?.label||'—')}</div>`;
    return h;}
  fieldsOf(st).forEach(f=>{
    if(f.type==='nums'){
      const hasAct=f.items.some(it=>it.actual);
      h+=`<div class="tbl-scroll"><table><thead><tr><th>Dato</th><th>Su valor</th>${hasAct?'<th>Simulador</th><th>Diferencia</th>':''}</tr></thead><tbody>`+
        f.items.map(it=>{const v=a[it.id];let c='';if(it.actual){const act=it.actual();const m=markNum(v,act,it.tol);c=`<td>${fmt(act,4)}</td><td class="${m.ok?'ok':'no'}">${m?(m.dif>=0?'+':'')+fmt(m.dif*100,2)+' %':'—'}</td>`;}
          return `<tr><td>${it.label}${it.unit?' ('+it.unit+')':''}</td><td>${esc(v)}</td>${c}</tr>`;}).join('')+'</tbody></table></div>';
    } else if(f.type==='arrows'){
      const act=f.actual();
      h+=`<div class="qa"><b>${f.label}</b></div><div class="tbl-scroll"><table><thead><tr><th>Parámetro</th><th>Predicción</th><th>Simulador</th><th></th></tr></thead><tbody>`+
        f.params.map(([k,l])=>{const p=a[f.id+'.'+k];const ok=p===act[k];return `<tr><td>${l}</td><td>${ARW[p]||'—'}</td><td>${ARW[act[k]]}</td><td class="${ok?'ok':'no'}">${ok?'✓':'✗'}</td></tr>`;}).join('')+'</tbody></table></div>';
    } else if(f.type==='matrix'){
      let okc=0;
      const rows=MATRIX_ROWS.map(([r,rl])=>`<tr><td>${rl}</td>${MATRIX_COLS.map(([c],j)=>{const p=a['mat.'+r+'.'+c];const k=MATRIX_KEY[r][j];const ok=p===k;if(ok)okc++;return `<td class="${ok?'ok':'no'}">${ARW[p]||'—'}${ok?'':' <small>('+ARW[k]+')</small>'}</td>`;}).join('')}</tr>`).join('');
      h+=`<p>Coincidencias con el modelo: <b>${okc} de 49</b>. Entre paréntesis, la respuesta del modelo.</p><div class="tbl-scroll"><table><thead><tr><th>Si aumenta…</th>${MATRIX_COLS.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
    } else {
      const v=f.type==='select'?(f.options.find(o=>o[0]===a[f.id])||[,''])[1]:a[f.id];
      h+=`<div class="qa"><b>${f.label}</b><span class="ans">${esc(v)}</span></div>`;
    }
  });
  return h;
}

/* ================= RENDER DE PASOS ================= */
function render(){
  const main=$('steps');main.innerHTML='';SIM=null;
  const total=STEPS.length-1;
  $('progFill').style.width=Math.min(100,state.cur/total*100)+'%';
  $('progTxt').textContent=state.cur>=total?'Actividad terminada':`Paso ${state.cur+1} de ${total}: ${STEPS[state.cur].block}`;
  STEPS.forEach((st,i)=>{
    if(i>state.cur)return;
    if(i<state.cur){
      const d=document.createElement('details');d.className='step';if(i===state.cur-1)d.open=true;
      const mins=state.start?Math.round((state.time[st.id]-state.start)/60000):0;
      d.innerHTML=`<summary><span><b>${st.block}</b> · ${st.title}</span><span class="when">Enviado ${hhmm(state.time[st.id])}${st.id!=='inicio'?` (min ${mins})`:''}</span></summary><div class="done-body">${doneHTML(st)}</div>`;
      main.appendChild(d);return;}
    const sec=document.createElement('section');sec.className='step current'+(st.kind==='final'?' final':'');
    if(st.kind==='final'){sec.innerHTML=finalHTML();main.appendChild(sec);wireFinal();return;}
    const tag=st.kind==='pred'?'<span class="tag pred">Predicción: sin simulador</span>':st.kind==='sim'?'<span class="tag sim">Simulador abierto</span>':st.kind==='diag'?'<span class="tag diag">Diagnóstico</span>':'';
    const d=state.draft[st.id]||{};
    sec.innerHTML=`<div class="step-body"><div class="kicker"><span>${st.block}</span>${tag}</div><h2>${st.title}</h2>${st.intro||''}
      ${st.sim||st.kind==='diag'?'<div class="simwrap"></div>':''}
      ${fieldsOf(st).map(f=>fieldHTML(st,f,d)).join('')}
      <div class="actions"><button class="btn primary" id="submitBtn">${st.submit||'Enviar diagnóstico'}</button><span class="err" id="errMsg" role="alert"></span></div>
      <p class="lock-note">Al enviar, estas respuestas quedan bloqueadas.</p></div>`;
    main.appendChild(sec);
    sec.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('input',()=>{(state.draft[st.id]=state.draft[st.id]||{})[el.dataset.f]=el.value;save();}));
    $('submitBtn').addEventListener('click',()=>submit(st,sec));
    if(st.kind==='diag'){
      if(!state.myst[st.id]){const base=PRESETS[st.base].s;const opts=MYST.filter(m=>!(m.packedOnly&&base.type!=='packed'));
        const used=Object.values(state.myst);let pool=opts.filter(m=>!used.includes(m.id));if(!pool.length)pool=opts;
        state.myst[st.id]=pool[Math.floor(Math.random()*pool.length)].id;save();}
      mountSim(sec.querySelector('.simwrap'),{preset:st.base,ref:{preset:st.base},refLabel:'cromatograma original',mystery:mystById(state.myst[st.id]),panels:['col','chrom']});
    } else if(st.sim) mountSim(sec.querySelector('.simwrap'),st.sim);
  });
  const c=main.querySelector('.step.current');if(c&&state.cur>0)c.scrollIntoView({block:'start'});
}
function submit(st,sec){

function setup(cv){const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));

function ticks(mn,mx,n=5){const span=mx-mn;if(span<=0)return[mn];const st0=span/n;const mag=Math.pow(10,Math.floor(Math.log10(st0)));const r=st0/mag;

function frame(ctx,w,h,xr,yr,xl,yl,C,opt={}){
  const pl=opt.pl||56,pr=14,pt=14,pb=40;

  ticks(xr[0],xr[1],opt.nx||6).forEach(t=>{const x=X(t);ctx.beginPath();ctx.moveTo(x,pt);ctx.lineTo(x,h-pb);ctx.globalAlpha=.35;ctx.stroke();ctx.globalAlpha=1;ctx.textAlign='center';ctx.fillText(tickLab(t,xr),x,h-pb+15);});
  if(!opt.noY)ticks(yr[0],yr[1],4).forEach(t=>{const y=Y(t);ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(w-pr,y);ctx.globalAlpha=.35;ctx.stroke();ctx.globalAlpha=1;ctx.textAlign='right';ctx.fillText(tickLab(t,yr),pl-6,y+4);});

  ctx.save();ctx.translate(13,(pt+h-pb)/2);ctx.rotate(-Math.PI/2);ctx.fillText(yl,0,0);ctx.restore();

const peakH=a=>1/(a.sigma*Math.sqrt(2*Math.PI));

function drawChrom(){

}
const dots=[];(function(){let s=7;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};for(let i=0;i<520;i++)dots.push([rnd(),rnd(),rnd()]);})();

function renderHydro(){

function renderThermo(){
  const r=SIM.cur,s=r.s;const [Tmin,Tmax2]=rangeOf('T');
  q('.tblThermo').innerHTML=`<thead><tr><th>T = ${fmt(s.T)} °C</th><th><span class="dot" style="background:var(--a)"></span>${r.an[0].name}</th><th><span class="dot" style="background:var(--b)"></span>${r.an[1].name}</th></tr></thead><tbody>
   <tr><td>ΔG° (kJ/mol)</td>${r.an.map(a=>`<td>${fmt(a.dG/1000,4)}</td>`).join('')}</tr><tr><td>K<sub>D</sub></td>${r.an.map(a=>`<td>${fmt(a.KD,4)}</td>`).join('')}</tr><tr><td>k</td>${r.an.map(a=>`<td>${fmt(a.k)}</td>`).join('')}</tr>
   <tr><td>k<sub>B</sub>/k<sub>A</sub></td><td colspan="2">${fmt(r.an[1].k/r.an[0].k,4)}</td></tr></tbody>`;
  const lnK=(p,TK)=>-(p.dH*1000-TK*p.dS)/(R*TK);const Tx=(s.B.dH-s.A.dH)*1000/(s.B.dS-s.A.dS);
  q('.thermoFlag').innerHTML='';
  let o=setup(q('.cv-vh'));const C=colors();const x0=1000/(Tmax2+273.15),x1=1000/(Tmin+273.15);
  const ys=[];for(const p of [s.A,s.B])for(const TC of [Tmin,Tmax2])ys.push(lnK(p,TC+273.15));const ymn=Math.min(...ys),ymx=Math.max(...ys),pad=(ymx-ymn)*.12||1;
  let F=frame(o.ctx,o.w,o.h,[x0,x1],[ymn-pad,ymx+pad],'1000/T (K⁻¹)','ln KD',C);
  [[s.A,C.a],[s.B,C.b]].forEach(([p,col])=>{o.ctx.beginPath();o.ctx.moveTo(F.X(x0),F.Y(lnK(p,1000/x0)));o.ctx.lineTo(F.X(x1),F.Y(lnK(p,1000/x1)));o.ctx.strokeStyle=col;o.ctx.lineWidth=2;o.ctx.stroke();
    o.ctx.fillStyle=col;o.ctx.beginPath();o.ctx.arc(F.X(1000/r.TK),F.Y(lnK(p,r.TK)),5,0,7);o.ctx.fill();});
  o.ctx.strokeStyle=C.muted;o.ctx.setLineDash([3,3]);o.ctx.beginPath();o.ctx.moveTo(F.X(1000/r.TK),F.pt);o.ctx.lineTo(F.X(1000/r.TK),o.h-F.pb);o.ctx.stroke();o.ctx.setLineDash([]);
  if(isFinite(Tx)&&1000/Tx>=x0&&1000/Tx<=x1){o.ctx.strokeStyle=C.bad;o.ctx.lineWidth=2;o.ctx.beginPath();o.ctx.arc(F.X(1000/Tx),F.Y(lnK(s.A,Tx)),7,0,7);o.ctx.stroke();}
  o=setup(q('.cv-alpha'));const aOf=TC=>Math.exp(lnK(s.B,TC+273.15)-lnK(s.A,TC+273.15));const av=[];for(let i=0;i<=100;i++)av.push(aOf(Tmin+(Tmax2-Tmin)*i/100));
  const amn=Math.min(...av,.98),amx=Math.max(...av,1.02),ap=(amx-amn)*.1;F=frame(o.ctx,o.w,o.h,[Tmin,Tmax2],[amn-ap,amx+ap],'Temperatura (°C)','kB / kA',C);
  o.ctx.fillStyle=C.shade;o.ctx.fillRect(F.pl,F.Y(1),o.w-F.pl-F.pr,F.Y(amn-ap)-F.Y(1));
  o.ctx.strokeStyle=C.bad;o.ctx.setLineDash([5,4]);o.ctx.beginPath();o.ctx.moveTo(F.pl,F.Y(1));o.ctx.lineTo(o.w-F.pr,F.Y(1));o.ctx.stroke();o.ctx.setLineDash([]);
  o.ctx.beginPath();av.forEach((v,i)=>{const x=F.X(Tmin+(Tmax2-Tmin)*i/100),y=F.Y(v);i?o.ctx.lineTo(x,y):o.ctx.moveTo(x,y);});o.ctx.strokeStyle=C.glass;o.ctx.lineWidth=2;o.ctx.stroke();
  o.ctx.fillStyle=C.ink;o.ctx.beginPath();o.ctx.arc(F.X(s.T),F.Y(aOf(s.T)),5,0,7);o.ctx.fill();
}
const purnell=(N,a,k)=>Math.sqrt(N)/4*(a-1)/a*k/(1+k);
function renderPurnell(){
  const r=SIM.cur;const eff=Math.sqrt(r.N)/4,sel=(r.alpha-1)/r.alpha,ret=r.p2.k/(1+r.p2.k);
  const m=(l,v,mx,t)=>`<div class="meter"><div class="lr"><span>${l}</span><span>${t}</span></div><div class="mb"><span style="width:${Math.max(1,Math.min(100,v/mx*100))}%"></span></div></div>`;
  q('.meters').innerHTML=m('√N/4',eff,Math.max(eff,100),fmt(eff))+m('(α − 1)/α',sel,Math.max(sel,.2),fmt(sel))+m('k<sub>2</sub>/(1 + k<sub>2</sub>)',ret,1,fmt(ret))+`<p style="margin:6px 0 0">R<sub>s</sub> (Purnell) = <b>${fmt(r.RsP)}</b></p>`;
  const Nreq=16*2.25*Math.pow(r.alpha/(r.alpha-1),2)*Math.pow((1+r.p2.k)/r.p2.k,2);const L2=Nreq*r.H/1e4;
  q('.tblReq').innerHTML=`<tbody><tr><td>N necesario</td><td>${fmt(Nreq)}</td></tr><tr><td>L necesaria</td><td>${fmt(L2)} cm</td></tr><tr><td>Factor de tiempo</td><td>× ${fmt(L2/r.L)}</td></tr></tbody>`;
  const tb=r.p2.tR;const S=[['Estado actual',r.RsP,tb],['Duplicar L',purnell(2*r.N,r.alpha,r.p2.k),2*tb],['Reducir H a la mitad',purnell(2*r.N,r.alpha,r.p2.k),tb],['Duplicar k',purnell(r.N,r.alpha,2*r.p2.k),r.tM*(1+2*r.p2.k)],['Duplicar (α − 1)',purnell(r.N,1+2*(r.alpha-1),r.p2.k),tb],['Bajar F a la mitad',r.RsP,2*tb]];
  q('.tblStrat').innerHTML='<thead><tr><th>Estrategia</th><th>R<sub>s</sub></th><th>t<sub>R</sub> último pico (min)</th></tr></thead><tbody>'+S.map(([a,b,c])=>`<tr><td>${a}</td><td>${fmt(b)}</td><td>${fmt(c)}</td></tr>`).join('')+'</tbody>';
  const {ctx,w,h}=setup(q('.cv-rsk'));const C=colors();const kmax=Math.max(20,r.p2.k*1.3);const f=k=>purnell(r.N,r.alpha,k);const ymax=Math.max(f(kmax),1.5)*1.15;
  const F=frame(ctx,w,h,[0,kmax],[0,ymax],'k₂','Rs',C);ctx.fillStyle=C.shade;ctx.fillRect(F.X(2),F.pt,F.X(Math.min(10,kmax))-F.X(2),h-F.pt-F.pb);
  ctx.strokeStyle=C.bad;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(F.pl,F.Y(1.5));ctx.lineTo(w-F.pr,F.Y(1.5));ctx.stroke();ctx.setLineDash([]);
  ctx.beginPath();for(let i=0;i<=300;i++){const k=0.02+kmax*i/300;const x=F.X(k),y=F.Y(f(k));i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.strokeStyle=C.glass;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(F.X(r.p2.k),F.Y(r.RsP),5,0,7);ctx.fill();
}

/* ================= REPORTE ================= */
function scores(){
  let aOk=0,aTot=0,nOk=0,nTot=0,mOk=0,dOk=0;
  STEPS.forEach(st=>{const a=state.ans[st.id]||{};
    if(st.kind==='diag'){if(a.hyp===state.myst[st.id])dOk++;return;}
    (st.fields||[]).forEach(f=>{
      if(f.type==='arrows'){const act=f.actual();f.params.forEach(([k])=>{aTot++;if(a[f.id+'.'+k]===act[k])aOk++;});}
      if(f.type==='nums')f.items.forEach(it=>{if(!it.actual)return;nTot++;const m=markNum(a[it.id],it.actual(),it.tol);if(m&&m.ok)nOk++;});
      if(f.type==='matrix')MATRIX_ROWS.forEach(([r])=>MATRIX_COLS.forEach(([c],j)=>{if(a['mat.'+r+'.'+c]===MATRIX_KEY[r][j])mOk++;}));
    });});
  return {aOk,aTot,nOk,nTot,mOk,dOk};
}
function reportBody(){
  const i=state.ans.inicio||{};const sc=scores();const end=state.time.cierre||Date.now();
  let h=`<h1>Reporte: Decisiones cromatográficas con evidencia</h1>
  <p><b>Equipo:</b> ${esc(i.equipo)} &nbsp; <b>Grupo:</b> ${esc(i.grupo)}<br><b>Integrantes:</b> <span class="ans">${esc(i.integrantes)}</span><br>
  <b>Fecha:</b> ${new Date(state.start||Date.now()).toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'})} &nbsp; <b>Inicio:</b> ${state.start?hhmm(state.start):'—'} &nbsp; <b>Fin:</b> ${hhmm(end)} &nbsp; <b>Duración:</b> ${state.start?Math.round((end-state.start)/60000):'—'} min</p>
  <div class="summary-grid"><div><b>${sc.aOk}/${sc.aTot}</b>predicciones de tendencia correctas</div><div><b>${sc.nOk}/${sc.nTot}</b>cálculos dentro de tolerancia</div><div><b>${sc.mOk}/49</b>celdas de la matriz</div><div><b>${sc.dOk}/3</b>diagnósticos correctos</div></div>
  <p style="font-size:.85rem">Las comparaciones usan el modelo del simulador. Tolerancias: 2 % a 20 % según el dato (las lecturas en pantalla admiten más error).</p>`;
  let lastBlock='';
  STEPS.forEach(st=>{if(st.id==='inicio'||st.kind==='final'||!state.time[st.id])return;
    if(st.block!==lastBlock){h+=`<h2 style="margin-top:22px">${st.block}</h2>`;lastBlock=st.block;}
    h+=`<h3>${st.title} <small style="font-weight:400">(enviado ${hhmm(state.time[st.id])}, minuto ${Math.round((state.time[st.id]-state.start)/60000)})</small></h3>${doneHTML(st)}`;});
  return h;
}

<style>body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:820px;margin:24px auto;padding:0 18px;color:#16232A;line-height:1.5;font-size:14px}

function reportText(){const tmp=document.createElement('div');tmp.innerHTML=reportBody();tmp.querySelectorAll('tr').forEach(tr=>{tr.append(' ');});return tmp.innerText;}
function finalHTML(){
  return `<div class="step-body"><div class="kicker"><span>Reporte</span></div><h2>Actividad terminada</h2>
  <p>Para entregar en Classroom:</p>
  <ol class="howto no-print"><li>Pulsen <b>Descargar reporte</b> y acepten la descarga.</li><li>Abran el archivo descargado y pulsen <b>Imprimir o guardar como PDF</b>; elijan "Guardar como PDF".</li><li>Suban el PDF a la tarea de Classroom (una entrega por equipo, con los nombres de todos).</li></ol>
  <div class="actions no-print"><button class="btn primary" id="dlBtn" hidden>Descargar reporte</button><button class="btn" id="prBtn">Imprimir esta página</button><button class="btn" id="cpBtn">Copiar reporte como texto</button><span class="err" id="dlMsg" role="status"></span></div>
  <hr style="margin:20px 0;border:0;border-top:1px solid var(--line)"><div class="report">${reportBody()}</div></div>`;
}
function wireFinal(){
  const msg=$('dlMsg');
  $('prBtn').addEventListener('click',()=>{try{window.print();}catch(e){msg.textContent='La impresión directa no está disponible aquí; usen Descargar reporte.';}});
  $('cpBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(reportText());msg.textContent='Reporte copiado. Péguenlo en un documento y guárdenlo como PDF.';}catch(e){msg.textContent='No se pudo copiar automáticamente; seleccionen el texto del reporte y cópienlo.';}});
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('downloads').then(dl=>{if(!dl)return;const b=$('dlBtn');if(!b)return;b.hidden=false;
      b.addEventListener('click',async()=>{const eq=((state.ans.inicio||{}).equipo||'equipo').replace(/[^\p{L}\p{N} _-]/gu,'').trim()||'equipo';
        try{await dl.save({filename:`Reporte cromatografia - ${eq}.html`,data:reportDoc()});msg.textContent='Reporte descargado. Ábranlo y guárdenlo como PDF.';}
        catch(e){const c=e&&e.code;msg.textContent=c==='declined'?'Descarga cancelada. Pueden intentarlo de nuevo.':c==='rate_limited'?'Esperen un momento y vuelvan a intentarlo.':'La descarga no está disponible aquí; usen Imprimir o Copiar.';}});});
  }
}
